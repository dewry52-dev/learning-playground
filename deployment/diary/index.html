<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루 한 장 · 나의 일기장</title><link rel="stylesheet" href="./style.css"></head>
<body><header><a href="https://dewry52-dev.github.io/learning-playground/">← 배움 팝! 허브</a><span>나를 위한 작은 기록</span><span class="badge">● 나만의 온라인 일기장</span></header>
<main><section class="account-panel"><p id="account">로그인 상태를 확인하고 있어요…</p><button id="login" class="primary" type="button">Google로 로그인</button><button id="logout" class="text-button" type="button" hidden>로그아웃</button></section><section class="hero"><div><p class="eyebrow">A LITTLE PAGE OF MY DAY</p><h1>하루, 한 장<span>✳</span></h1><p>반짝이는 순간도, 평범한 하루도.<br>오늘의 마음을 여기에 남겨요.</p></div><div class="paper" aria-hidden="true">Dear, today<br><span>오늘의 나는<br>어땠을까?</span><b>✎</b></div></section>
<div class="workspace"><aside><div class="list-heading"><h2>모아 둔 하루</h2><span id="count">0장</span></div><button id="new" disabled class="primary">＋ 새 일기 쓰기</button><label class="search">일기 찾기<input id="search" type="search" placeholder="제목이나 내용으로 검색"></label><label class="month">월별로 보기<input id="month" type="month"></label><button id="clear-filter" class="text-button">필터 초기화</button><div id="entries" aria-label="일기 목록"></div></aside>
<section class="editor"><div class="editor-top"><span class="eyebrow" id="mode">TODAY'S PAGE · 새 일기</span><span id="letters">0자</span></div><form id="form"><div class="date-row"><label>날짜<input id="date" disabled type="date" required></label><label>오늘의 기분<select id="mood" disabled><option value="happy">😊 행복해요</option><option value="calm">🌿 평온해요</option><option value="excited">✨ 설레요</option><option value="sad">🌧️ 속상해요</option><option value="tired">🌙 피곤해요</option></select></label></div><label class="sr-only" for="title">일기 제목</label><input id="title" disabled class="title" maxlength="100" required placeholder="오늘을 한 문장으로 표현한다면?"><label class="sr-only" for="body">일기 내용</label><textarea id="body" disabled maxlength="30000" required placeholder="오늘 어떤 일이 있었나요?&#10;기억에 남는 순간과 마음을 편하게 적어 보세요."></textarea><div class="editor-bottom"><p>작은 기록들이 모여 나의 이야기가 돼요.</p><div><button id="delete" disabled type="button" class="danger" hidden>삭제</button><button id="save" disabled class="primary" type="submit">일기 저장 ↗</button></div></div></form><p id="status" role="status" aria-live="polite"></p></section></div>
<footer>일기는 로그인한 계정에 저장됩니다. 공용 기기에서는 사용 후 로그아웃하세요.</footer></main><script type="module" src="./app.js"></script></body></html>
