<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루 한 장 · 나의 일기장</title><link rel="stylesheet" href="/diary/style.css"></head>
<body><header><a href="/">← 배움 팝! 허브</a><span>나를 위한 작은 기록</span><span class="badge">● 로컬 폴더에 저장</span></header>
<main><section class="hero"><div><p class="eyebrow">A LITTLE PAGE OF MY DAY</p><h1>하루, 한 장<span>✳</span></h1><p>반짝이는 순간도, 평범한 하루도.<br>오늘의 마음을 여기에 남겨요.</p></div><div class="paper" aria-hidden="true">Dear, today<br><span>오늘의 나는<br>어땠을까?</span><b>✎</b></div></section>
<div class="workspace"><aside><div class="list-heading"><h2>모아 둔 하루</h2><span id="count">0장</span></div><button id="new" class="primary">＋ 새 일기 쓰기</button><label class="search">일기 찾기<input id="search" type="search" placeholder="제목이나 내용으로 검색"></label><label class="month">월별로 보기<input id="month" type="month"></label><button id="clear-filter" class="text-button">필터 초기화</button><div id="entries" aria-label="일기 목록"></div></aside>
<section class="editor"><div class="editor-top"><span class="eyebrow" id="mode">TODAY'S PAGE · 새 일기</span><span id="letters">0자</span></div><form id="form"><div class="date-row"><label>날짜<input id="date" type="date" required></label><label>오늘의 기분<select id="mood"><option value="happy">😊 행복해요</option><option value="calm">🌿 평온해요</option><option value="excited">✨ 설레요</option><option value="sad">🌧️ 속상해요</option><option value="tired">🌙 피곤해요</option></select></label></div><label class="sr-only" for="title">일기 제목</label><input id="title" class="title" maxlength="100" required placeholder="오늘을 한 문장으로 표현한다면?"><label class="sr-only" for="body">일기 내용</label><textarea id="body" maxlength="30000" required placeholder="오늘 어떤 일이 있었나요?&#10;기억에 남는 순간과 마음을 편하게 적어 보세요."></textarea><div class="editor-bottom"><p>작은 기록들이 모여 나의 이야기가 돼요.</p><div><button id="delete" type="button" class="danger" hidden>삭제</button><button id="save" class="primary" type="submit">일기 저장 ↗</button></div></div></form><p id="status" role="status" aria-live="polite"></p></section></div>
<footer>기록은 이 컴퓨터의 <code>math-gallery/data/diary.sqlite</code>에 저장됩니다. 저장 버튼을 눌러 기록을 남겨 주세요.</footer></main><script src="/diary/app.js" defer></script></body></html>
